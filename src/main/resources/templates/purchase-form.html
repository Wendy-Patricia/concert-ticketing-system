
<!DOCTYPE html>
<html lang="fr" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Achat de billets</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>

<header>
    <h1>Concert Ticketing System</h1>
</header>

<nav>
    <a th:href="@{/clients/inscription}">Inscription</a>
    <a th:href="@{/fidelite}">Fidélité</a>
    <a th:href="@{/billets/acheter}">Billets</a>
</nav>

<main>
    <h2>Acheter des billets</h2>

    <p th:if="${message}" class="message"
       th:text="${message}"></p>

    <p th:if="${error}" class="message error"
       th:text="${error}"></p>

    <form th:action="@{/billets/acheter}" method="post">

        <label for="customerId">Identifiant client</label>
        <input id="customerId" type="number"
               name="customerId" min="1" required>

        <label for="concertId">Identifiant concert</label>
        <input id="concertId" type="number"
               name="concertId" min="1" required>

        <label for="quantity">Nombre de billets (1 à 6)</label>
        <input id="quantity" type="number"
               name="quantity" min="1" max="6" required>

        <button type="submit">Acheter</button>
    </form>
</main>

</body>
</html>
